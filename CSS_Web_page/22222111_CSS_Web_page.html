<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 700px;
            height: 1000px;
            background-color: gainsboro;
            
            border: 5px solid plum;
            border-radius: 20px;
        }

        #header {
            background-color: skyblue;        
            text-align: center;
            color: hotpink;
            padding: 40px 20px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        #profile{
            background-color: lightblue;
            border: 3px solid plum;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;

            margin: 20px;
        }


        #profile_image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid plum;
        }

        #favorite_skill {
            background-color: lightgray;
            margin: 20px;
            border: 3px solid plum;
            border-radius: 15px;
            padding: 20px;
        }

        #favorite_skill h2{
            color: hotpink;
        }

        #favorite_skill hr{
            background-color: hotpink;
            height: 2px;
            border: none;
        }

        #favorite_skill p{
            display: inline-block;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            margin: 5px;
        }

        #favorite_skill p.a {
        background-color: cyan;
        }

        #favorite_skill p.b {
        background-color: hotpink;
        }

        #favorite_skill p.c {
        background-color: purple;
        color: white;
        }

        #favorite_skill p.d {
        background-color: yellow;
        }

        


    </style>
</head>
<body>
    <div id="header">
        <h1>MY PROFILE</h1>
        <p><em>Web Programming Practice</em></p>
    </div>

    <div id="profile">
        <img src="고양이이미지.webp" alt="프로필 사진" id="profile_image">
        <div>
            <h3>김완</h3>
            <p>전공: 컴퓨터소프트웨어전공</p>
            <p>관심분야: HTML / CSS / JavaScript</p>
        </div>
        
    </div>

    <div id="favorite_skill">
        <h2>관심 기술</h2>
        <hr>
        <p class="a">HTML</p>
        <p class="b">CSS</p>
        <p class="c">JavaScript</p>
        <p class="d">Git</p>
        
    </div>

</body>
</html>
