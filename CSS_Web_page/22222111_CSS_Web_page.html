<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 700px;
            height: 1000px;
            background-color: lightgray;

            border: 5px solid plum;
            border-radius: 20px;
        }

        #header {
            background-color: skyblue;        
            text-align: center;
            padding: 40px 20px;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
        }

        #profile{
            background-color: lightblue;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;

            margin: 20px;
        }


        #profile_image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid plum;
        }
        


    </style>
</head>
<body>
    <div id="header">
        <h1>MY PROFILE</h1>
        <p><em>Web Programming Practice</em></p>
    </div>

    <div id="profile">
        <img src="고양이이미지.webp" alt="프로필 사진" id="profile_image">
        <div>
            <h3>김완</h3>
            <p>전공: 컴퓨터소프트웨어전공</p>
            <p>관심분야: HTML / CSS / JavaScript</p>
        </div>
        
    </div>

</body>
</html>
